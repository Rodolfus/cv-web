<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumbo PER</title>
<meta name="description" content="Prepara el examen teórico del PER desde cero: teoría sencilla, tests y simulacros.">
<meta name="theme-color" content="#0a6c88">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Concepto: cuaderno de bitácora moderno. Fondo azul grisáceo frío, tinta marino, acento verde mar. Las marcas IALA llevan sus colores reales. */
:root{
  --bg:#eef3f6; --surface:#ffffff; --ink:#0d2331; --muted:#566b79; --line:#d2dde4;
  --accent:#0a6c88; --accent-ink:#ffffff; --soft:#e0eff4; --sea:#cfe3ec;
  --ok:#1b7f4b; --ok-bg:#e1f3e9; --bad:#b83428; --bad-bg:#fbe8e5; --warn:#9a6508; --warn-bg:#fbf0d9;
  --f-head:'Space Grotesk','Segoe UI',system-ui,sans-serif;
  --f-body:'Inter','Segoe UI',system-ui,sans-serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a171f; --surface:#112530; --ink:#e5eff5; --muted:#92a9b7; --line:#22394680;
    --accent:#52c4df; --accent-ink:#04202a; --soft:#143240; --sea:#17384a;
    --ok:#52cf90; --ok-bg:#12372a; --bad:#ff8579; --bad-bg:#40201d; --warn:#e8b552; --warn-bg:#3b2f13;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a171f; --surface:#112530; --ink:#e5eff5; --muted:#92a9b7; --line:#22394680;
  --accent:#52c4df; --accent-ink:#04202a; --soft:#143240; --sea:#17384a;
  --ok:#52cf90; --ok-bg:#12372a; --bad:#ff8579; --bad-bg:#40201d; --warn:#e8b552; --warn-bg:#3b2f13;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.02em}
h2{font-size:22px;letter-spacing:-.01em}
h3{font-size:18px}
p{margin:0 0 12px}
a{color:var(--accent)}
code{font-family:var(--f-mono);background:var(--soft);padding:1px 6px;border-radius:4px;font-size:.92em}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);font-weight:600}

/* barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-block:16px 12px}
.brand{font-family:var(--f-head);font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{font-family:var(--f-head);font-weight:500;font-size:15px;color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:8px}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

main{display:flex;flex-direction:column;gap:20px;padding-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.card.flat{background:transparent;border-style:dashed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.btn{font-family:var(--f-head);font-weight:600;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:default}
.chip{font-family:var(--f-head);font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill{display:inline-block;font-family:var(--f-head);font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--accent)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}

/* inicio */
.hero{display:flex;flex-direction:column;gap:14px;padding-block:8px 4px}
.hero p{max-width:60ch;font-size:18px;color:var(--muted);margin:0}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-head);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.units{display:flex;flex-direction:column}
.unit{display:grid;grid-template-columns:36px 1fr auto;gap:4px 14px;align-items:center;padding:14px 4px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.unit:first-child{border-top:0}
.unit:hover{background:var(--soft)}
.unit .no{font-family:var(--f-head);font-weight:700;font-size:20px;color:var(--accent);grid-row:span 2;text-align:center}
.unit .nm{font-family:var(--f-head);font-weight:600}
.unit .ds{font-size:14px;color:var(--muted);grid-column:2}
.unit .meta{text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;grid-row:span 2}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* lección */
.lesson{display:flex;flex-direction:column;gap:14px}
.lesson ul,.lesson ol{margin:0 0 4px;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.lesson ul ul{margin-top:6px}
.tip{background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:15px}
.figs{display:flex;gap:8px 18px;flex-wrap:wrap;margin:6px 0}
.figs figure{margin:0;text-align:center;width:92px}
.figs figcaption{font-size:12px;color:var(--muted);line-height:1.25;margin-top:2px}
.figs svg,.qfig svg{width:64px;height:100px;display:block;margin:0 auto}
.check{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.check .eyebrow{color:var(--accent)}
.done{color:var(--ok)}

/* preguntas */
.qtext{font-family:var(--f-head);font-size:19px;font-weight:600;line-height:1.35;margin-bottom:12px}
.qfig{margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .ltr{font-family:var(--f-head);font-weight:700;color:var(--muted);flex:none;width:18px}
.opt .otx{min-width:0}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default;color:var(--ink)}
.why{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:15px}
.why.ok{background:var(--ok-bg)}
.why.bad{background:var(--bad-bg)}
.prog{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-head);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.timer{font-weight:700;color:var(--ink)}
.timer.low{color:var(--bad)}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.grid button{width:38px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--f-head);font-weight:600;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.grid button.ans{background:var(--soft);border-color:var(--accent)}
.grid button.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* resultados */
.verdict{font-family:var(--f-head);font-size:30px;font-weight:700}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-head);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll{overflow-x:auto}
.review{display:flex;flex-direction:column;gap:14px}
.review .card{padding:16px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pick{font:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.pick:hover{border-color:var(--accent)}
.pick b{font-family:var(--f-head)}
.pick span{font-size:13px;color:var(--muted)}
dl{margin:0;display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:8px 18px}
dt{font-family:var(--f-head);font-weight:600}
dd{margin:0;min-width:0}
@media (max-width:560px){dl{grid-template-columns:1fr;gap:2px}dd{margin-bottom:10px}.unit{grid-template-columns:30px 1fr}.unit .meta{grid-column:2;grid-row:auto;text-align:left}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// Temario del PER según el Anexo II del RD 875/2014 (11 unidades, 45 preguntas)
const UNITS = [
{ id:1, n:4, t:'Nomenclatura náutica', d:'Las partes del barco y cómo se llaman sus medidas.', lessons:[
 { h:'Las partes del barco', b:`
<p>Imagina que estás en el centro del barco, mirando hacia delante.</p>
<ul>
<li><b>Proa</b>: la parte de delante.</li>
<li><b>Popa</b>: la parte de atrás.</li>
<li><b>Babor</b>: tu <b>izquierda</b>. Luz <b>roja</b>.</li>
<li><b>Estribor</b>: tu <b>derecha</b>. Luz <b>verde</b>.</li>
<li><b>Amura</b>: la zona curva del casco a cada lado de la proa.</li>
<li><b>Aleta</b>: la zona curva a cada lado de la popa.</li>
<li><b>Través</b>: justo a un lado, a 90° de la proa.</li>
</ul>
<p class="tip">Truco: el vino de <b>Oporto</b> (port, babor) es tinto, como la luz roja de babor.</p>` },
 { h:'Medidas y posiciones', b:`
<ul>
<li><b>Eslora</b>: lo largo del barco.</li>
<li><b>Manga</b>: lo ancho, en la parte más ancha.</li>
<li><b>Puntal</b>: la altura del casco, de la quilla a la cubierta.</li>
<li><b>Calado</b>: lo que se hunde el barco. Va de la línea de flotación a la quilla.</li>
<li><b>Francobordo</b>: lo que sobresale del agua, de la flotación a la cubierta.</li>
<li><b>Obra viva</b> (o carena): la parte del casco que va <b>sumergida</b>.</li>
<li><b>Obra muerta</b>: la parte que queda <b>fuera</b> del agua.</li>
<li><b>Asiento</b>: la diferencia entre el calado de popa y el de proa.</li>
<li><b>Escora</b>: la inclinación del barco hacia un costado.</li>
</ul>` },
 { h:'Hélice, timón y ancla', b:`
<p>La hélice puede girar de dos maneras al ir hacia delante. <b>Dextrógira</b>: gira a derechas (como las agujas del reloj, visto desde popa). <b>Levógira</b>: gira a izquierdas.</p>
<p>El timón se maneja con una <b>caña</b> (palanca) o con una <b>rueda</b>. La pieza que se mueve en el agua es la <b>pala</b>.</p>
<p>Partes del ancla: el <b>arganeo</b> (anilla donde se une la cadena), la <b>caña</b> (el palo central), las <b>uñas</b> (lo que se clava en el fondo) y el <b>cepo</b> (barra que ayuda a que agarre). La cadena sale del barco por el <b>escoben</b> y se recoge con el <b>molinete</b>.</p>` }
]},
{ id:2, n:2, t:'Amarre y fondeo', d:'Nudos básicos, amarras y cómo echar el ancla.', lessons:[
 { h:'Nudos y amarras', b:`
<p>Tres nudos que necesitas sí o sí:</p>
<ul>
<li><b>As de guía</b>: hace un lazo que no se corre. Sirve para amarrar a una anilla o a una bita.</li>
<li><b>Nudo llano</b>: une dos cabos del mismo grosor.</li>
<li><b>Ballestrinque</b>: se hace rápido y sirve para amarrar a un poste o una barandilla.</li>
</ul>
<p>Cuando amarras al muelle usas varios cabos con nombre:</p>
<ul>
<li><b>Largos</b>: salen de proa o popa hacia delante o atrás.</li>
<li><b>Traveses</b>: salen del costado, perpendiculares al muelle.</li>
<li><b>Esprines</b>: salen cruzados y evitan que el barco se mueva hacia delante o hacia atrás.</li>
</ul>` },
 { h:'Fondear', b:`
<ul>
<li><b>Fondear</b>: echar el ancla. <b>Levar</b>: recogerla.</li>
<li>Mejor fondo para que agarre: <b>arena o fango</b>. Malo: roca lisa, piedras, algas.</li>
<li>La <b>posidonia</b> (pradera de plantas marinas) está protegida. No se fondea sobre ella.</li>
<li><b>Escopo</b>: cuánta cadena largas respecto a la profundidad. Cuanta más largues, mejor agarra. Con viento fuerte, largas más.</li>
<li><b>Garrear</b>: cuando el ancla no agarra y se arrastra por el fondo.</li>
<li>Cadena <b>a pique</b>: está vertical y el ancla está a punto de despegar del fondo.</li>
</ul>` }
]},
{ id:3, n:4, t:'Seguridad en la mar', d:'Qué revisar antes de salir y qué hacer si algo va mal.', lessons:[
 { h:'Antes de zarpar', b:`
<ul>
<li>Mira la <b>previsión meteorológica</b>. Si es mala, no salgas.</li>
<li>Comprueba combustible, batería, motor, bomba de achique y el <b>material de seguridad</b>: chalecos, aros, bengalas, extintor, botiquín, radio.</li>
<li>Deja a alguien de confianza en tierra tu <b>plan de ruta</b> y a qué hora piensas volver.</li>
<li>Explica a la tripulación dónde está el material y qué hacer si alguien cae al agua.</li>
</ul>
<p><b>Estabilidad</b>: es la capacidad del barco de volver a su posición normal después de inclinarse. Repartir bien el peso la mejora.</p>` },
 { h:'Mal tiempo y emergencias', b:`
<ul>
<li><b>Capear</b> un temporal: reducir velocidad al mínimo que permita gobernar y poner la proa a las olas, no de costado.</li>
<li><b>Hombre al agua</b>: gritar «hombre al agua», lanzar un aro salvavidas, no perderlo de vista y marcar la posición en el GPS.</li>
<li><b>Remolque</b>: cabo largo y resistente, amarrado a puntos firmes y a poca velocidad.</li>
<li><b>Pedir ayuda</b>: radio VHF <b>canal 16</b>, o el teléfono de Salvamento Marítimo <b>900 202 202</b>. También funciona el 112.</li>
<li><b>Señales de socorro</b>: bengala roja de mano, cohete con paracaídas rojo, humo naranja.</li>
<li><b>Radiobaliza EPIRB</b>: al activarla manda tu posición por satélite.</li>
</ul>` }
]},
{ id:4, n:2, t:'Legislación', d:'Reglas sobre puertos, bañistas, residuos y espacios protegidos.', lessons:[
 { h:'Lo que debes saber', b:`
<ul>
<li><b>Bandera</b>: la embarcación española lleva la bandera de España en la <b>popa</b>.</li>
<li><b>Documentos a bordo</b>: tu título, la documentación de la embarcación y el <b>seguro de responsabilidad civil</b> obligatorio.</li>
<li><b>Bañistas</b>: las zonas de baño balizadas están prohibidas a la navegación. Solo se entra por los canales señalizados y despacio.</li>
<li><b>Buzos</b>: la <b>bandera «A»</b> del código internacional (azul y blanca) significa «tengo buzos sumergidos, mantente alejado y despacio».</li>
<li><b>Contaminación</b>: está prohibido tirar plásticos y basura al mar. Nunca se vierten hidrocarburos.</li>
<li><b>Auxilio</b>: debes ayudar a quien esté en peligro en el mar, si no pones en grave riesgo tu barco ni a tu gente.</li>
<li><b>Espacios protegidos</b>: no se fondea sobre posidonia. En reservas marinas hay normas propias.</li>
</ul>` }
]},
{ id:5, n:5, t:'Balizamiento', d:'Boyas y luces que marcan canales y peligros. Un bloque exigente: necesitas 3 de 5.', lessons:[
 { h:'Marcas laterales y aguas navegables', b:`
<p>Usamos el sistema <b>IALA, Región A</b> (Europa, África y gran parte de Asia). Lo que importa es el sentido en que entras a puerto desde el mar.</p>
<ul>
<li><b>Babor</b> (izquierda al entrar): boya <b>roja</b>, cilíndrica, luz roja.</li>
<li><b>Estribor</b> (derecha al entrar): boya <b>verde</b>, cónica con la punta arriba, luz verde.</li>
</ul>
<p>Las <b>aguas navegables</b> (centro del canal) llevan franjas verticales <b>rojas y blancas</b> y una esfera roja arriba.</p>
<div class="figs" data-figs="port,stbd,safe"></div>` },
 { h:'Marcas cardinales', b:`
<p>Dicen en qué lado de ellas está el agua buena. Siempre pasas por el lado que dice su nombre. Las <b>puntas de los conos</b> te enseñan la dirección.</p>
<ul>
<li><b>Norte</b>: negro arriba, amarillo abajo. Dos conos con la punta <b>arriba</b>. Luz blanca centelleante continua.</li>
<li><b>Sur</b>: amarillo arriba, negro abajo. Dos conos con la punta <b>abajo</b>. Luz con 6 centelleos y uno largo.</li>
<li><b>Este</b>: negro, amarillo, negro. Conos <b>base con base</b> (un rombo). Luz con 3 centelleos.</li>
<li><b>Oeste</b>: amarillo, negro, amarillo. Conos <b>punta con punta</b> (reloj de arena). Luz con 9 centelleos.</li>
</ul>
<p class="tip">Truco de la luz: piensa en un reloj. Este = las 3, Sur = las 6, Oeste = las 9, Norte = continua.</p>
<div class="figs" data-figs="N,E,S,W"></div>` },
 { h:'Peligro aislado, especiales y bifurcación', b:`
<ul>
<li><b>Peligro aislado</b>: negra con bandas rojas y <b>dos esferas negras</b>. Marca un peligro pequeño. Se pasa a distancia por cualquier lado.</li>
<li><b>Marca especial</b>: toda <b>amarilla</b> con un aspa (X) amarilla. Zonas de ocio, cables, etc.</li>
<li><b>Bifurcación</b>: dónde se divide un canal. La parte de arriba dice por qué lado dejarla y la banda ancha dice cuál es el canal principal.
 <ul><li>Roja con banda verde: se deja por babor y el canal principal queda a <b>estribor</b>.</li>
 <li>Verde con banda roja: se deja por estribor y el canal principal queda a <b>babor</b>.</li></ul></li>
</ul>
<div class="figs" data-figs="isol,special,prefStbd,prefPort"></div>` },
 { h:'Luces y ritmos', b:`
<ul>
<li><b>Fl</b> (destello): un destello corto, mucha oscuridad.</li>
<li><b>Q</b> (centelleo) y <b>VQ</b> (muy rápido): destellos seguidos, 60 o 120 por minuto.</li>
<li><b>LFl</b>: destello largo (2 s o más).</li>
<li><b>Iso</b> (isofase): luz y oscuridad iguales. Por ejemplo, 2 s encendida y 2 s apagada.</li>
<li><b>Oc</b> (ocultaciones): <b>más luz que oscuridad</b>.</li>
<li><b>F</b>: luz fija.</li>
</ul>
<p>Cómo se lee: <code>Fl(3) G 10s</code> = luz verde de 3 destellos cada 10 segundos.</p>` }
]},
{ id:6, n:10, t:'Reglamento (RIPA)', d:'Las reglas para no chocar. Es el bloque con más preguntas: 10 de 45.', lessons:[
 { h:'Reglas básicas', b:`
<ul>
<li>Mantén siempre <b>vigilancia</b> con la vista y el oído.</li>
<li>Navega a <b>velocidad de seguridad</b>: la que te permite maniobrar y parar a tiempo según visibilidad, tráfico y mar.</li>
<li><b>Riesgo de abordaje</b>: si la demora del otro barco <b>no cambia</b> mientras se acerca, vais a chocar.</li>
<li>La maniobra para evitarlo debe ser <b>clara, con tiempo y lo bastante grande</b> para que la vea el otro.</li>
</ul>` },
 { h:'Cuándo cede cada barco', b:`
<p>Entre dos barcos de <b>motor</b>:</p>
<ul>
<li><b>De frente</b> (rumbos opuestos): los dos caen a <b>estribor</b> y se cruzan por babor.</li>
<li><b>Cruzándose</b>: cede el que ve al otro por su <b>estribor</b> (derecha). El otro mantiene rumbo y velocidad.</li>
<li><b>Alcance</b>: el que alcanza por detrás (desde más de 22,5° a popa del través) cede siempre.</li>
</ul>
<p>Entre dos <b>veleros</b>:</p>
<ul>
<li>Viento por <b>distinto</b> costado: cede el que tiene el viento por <b>babor</b>.</li>
<li>Viento por el <b>mismo</b> costado: cede el de <b>barlovento</b> (el más cerca del viento).</li>
</ul>` },
 { h:'Prioridades y zonas especiales', b:`
<p>Si son de tipo distinto, cede el que está más abajo en esta lista:</p>
<ol>
<li>Buque <b>sin gobierno</b></li>
<li>Buque de <b>maniobra restringida</b></li>
<li>Buque de <b>pesca</b> con artes que limitan la maniobra</li>
<li><b>Velero</b></li>
<li>Barco de <b>motor</b></li>
</ol>
<p>Un barco de motor cede ante un velero, salvo que lo esté alcanzando.</p>
<ul>
<li><b>Canal estrecho</b>: ve por el lado de <b>estribor</b> del canal, lo más cerca de su límite exterior.</li>
<li><b>Separación de tráfico</b>: cruza con rumbo lo más <b>perpendicular</b> posible.</li>
</ul>` },
 { h:'Luces y marcas de día', b:`
<p>Un barco de <b>motor navegando</b> lleva: <b>luz de tope</b> blanca (al frente), <b>roja</b> a babor, <b>verde</b> a estribor y <b>luz de alcance</b> blanca en popa. Si mide <b>50 m o más</b>, lleva dos luces de tope (la de atrás más alta).</p>
<p>Un <b>velero navegando</b> lleva las dos de costado y la de alcance. No lleva luz de tope.</p>
<ul>
<li>Si ves <b>solo la luz blanca de popa</b>, estás alcanzando a ese barco. Cedes tú.</li>
<li><b>Sin gobierno</b>: dos luces rojas en vertical. De día, dos bolas negras.</li>
<li><b>Fondeado</b>: luz blanca visible en todo el horizonte. De día, <b>una bola negra</b> en la proa.</li>
<li>Velero con el <b>motor funcionando</b>: de día, un <b>cono negro con la punta hacia abajo</b>. Cuenta como barco de motor.</li>
</ul>
<p>Reparto de los sectores de luz: tope 225°, cada costado 112,5° y alcance 135°.</p>` },
 { h:'Señales de sonido y niebla', b:`
<p><b>Maniobra</b> con pitadas cortas (cuando os veis): <b>1 corta</b> = caigo a estribor, <b>2 cortas</b> = caigo a babor, <b>3 cortas</b> = voy atrás, <b>5 cortas</b> = no entiendo tus intenciones o hay peligro.</p>
<p><b>Con niebla</b> (visibilidad reducida), cada 2 minutos como máximo:</p>
<ul>
<li>Motor con arrancada: <b>1 larga</b>.</li>
<li>Motor parado, sin arrancada: <b>2 largas</b>.</li>
<li>Velero, pesca, sin gobierno, remolcando: <b>1 larga y 2 cortas</b>.</li>
<li>Fondeado: <b>campana rápida unos 5 segundos cada minuto</b>.</li>
</ul>` }
]},
{ id:7, n:2, t:'Maniobra y navegación', d:'Cómo responde el barco al timón y a la hélice.', lessons:[
 { h:'Gobierno y atraque', b:`
<ul>
<li><b>Caña</b>: se mueve hacia el lado <b>contrario</b> al que quieres ir. Caña a babor, proa a estribor.</li>
<li><b>Rueda</b>: igual que un coche. Giras la rueda a estribor y la proa va a estribor.</li>
<li>Al girar, la <b>popa se abre hacia fuera</b> (lado contrario al giro).</li>
<li>Hélice <b>dextrógira</b> en <b>marcha atrás</b>: la popa se va hacia <b>babor</b>.</li>
<li><b>Atracar</b>: acércate con la proa contra el viento o la corriente (la que más empuje), con un ángulo suave, y lleva defensas preparadas.</li>
<li><b>Boya</b>: aproxímate con la proa al viento o a la corriente, a poca velocidad.</li>
</ul>` }
]},
{ id:8, n:3, t:'Emergencias en la mar', d:'Heridos, incendios, vías de agua y abandono del barco.', lessons:[
 { h:'Qué hacer y en qué orden', b:`
<ul>
<li><b>Hemorragia</b>: presiona directamente sobre la herida con una gasa limpia.</li>
<li><b>Hipotermia</b>: quita la ropa mojada, abriga y da bebida caliente sin alcohol. No frotes.</li>
<li><b>Fuego</b>: necesita cuatro cosas (tetraedro): <b>combustible, comburente (oxígeno), calor y reacción en cadena</b>. Quitas una y se apaga. <b>Sofocar</b> quita el oxígeno. <b>Enfriar</b> quita el calor.</li>
<li>Fuego <b>eléctrico</b>: extintor de CO₂ o polvo. <b>Nunca agua</b>.</li>
<li><b>Vía de agua</b>: localízala, tápala con lo que tengas y achica.</li>
<li><b>Varada</b>: para el motor, mira si hay heridos y daños, y sonda alrededor antes de intentar salir.</li>
<li><b>Abandono</b>: es el <b>último recurso</b>. Mientras el barco flote, es más seguro quedarse a bordo. Pasa a la balsa salvavidas.</li>
</ul>` }
]},
{ id:9, n:4, t:'Meteorología', d:'Presión, viento, mar y señales de cambio de tiempo.', lessons:[
 { h:'Presión y viento', b:`
<ul>
<li><b>Presión atmosférica</b>: se mide en hectopascales (hPa).</li>
<li><b>Isobara</b>: línea que une puntos con la <b>misma presión</b>. Si están muy juntas, hay <b>viento fuerte</b>.</li>
<li><b>Anticiclón</b> (alta presión): tiempo estable y bueno.</li>
<li><b>Borrasca</b> (baja presión): nubes, lluvia y viento.</li>
<li>El viento se nombra por <b>de dónde viene</b>. Viento del NW viene del noroeste.</li>
<li><b>Escala Beaufort</b>: mide la fuerza del viento de 0 a 12.</li>
</ul>` },
 { h:'Viento aparente, brisas y mar', b:`
<ul>
<li><b>Viento aparente</b>: el que sientes yendo en el barco. Con viento por la <b>popa</b> se <b>resta</b> tu velocidad: viento real 16 nudos, vas a 6, sientes 10. De proa se suma.</li>
<li><b>Brisa marina</b> (de día): sopla del <b>mar hacia la tierra</b>. <b>Terral</b> (de noche): de tierra al mar.</li>
<li><b>Fetch</b>: la distancia de mar abierta por la que sopla el viento sin obstáculos. Cuanto mayor, más grande la ola.</li>
<li><b>Mar de viento</b> lo crea el viento de ahora. <b>Mar de fondo</b> viene de lejos.</li>
</ul>` },
 { h:'Frentes, nubes y señales', b:`
<ul>
<li>Presión que <b>baja deprisa</b>: se acerca mal tiempo. Si <b>sube</b>, mejora.</li>
<li><b>Cumulonimbos</b>: nubes altas y oscuras de tormenta.</li>
<li><b>Cúmulos</b> pequeños y aislados: buen tiempo.</li>
<li><b>Frente frío</b>: baja la temperatura y vienen chubascos y rachas fuertes.</li>
<li><b>Frente cálido</b>: nubes bajas, lluvia suave y continua.</li>
</ul>` }
]},
{ id:10, n:5, t:'Teoría de navegación', d:'Coordenadas, rumbos, correcciones y mareas.', lessons:[
 { h:'Coordenadas y unidades', b:`
<ul>
<li><b>Latitud</b>: de 0° a 90° desde el ecuador, hacia el norte o el sur.</li>
<li><b>Longitud</b>: de 0° a 180° desde el meridiano de Greenwich, hacia el este o el oeste.</li>
<li><b>1 milla náutica</b> = 1.852 m = <b>1 minuto de latitud</b>.</li>
<li><b>1 nudo</b> = 1 milla por hora.</li>
<li>Distancia = velocidad × tiempo.</li>
<li><b>Hora reloj bitácora (HRB)</b>: la que marca el reloj de a bordo.</li>
</ul>` },
 { h:'Rumbos y correcciones', b:`
<ul>
<li><b>Rumbo</b>: ángulo entre el norte y la dirección de la proa (de 000° a 360°).</li>
<li><b>Declinación magnética (dm)</b>: diferencia entre el norte verdadero y el magnético. Viene en la carta.</li>
<li><b>Desvío (Δ)</b>: error de la aguja por los hierros del propio barco.</li>
<li><b>Corrección total</b>: <code>Ct = dm + Δ</code>. Este o NE es <b>+</b>, oeste o NW es <b>−</b>.</li>
<li>De aguja a verdadero: <code>Rv = Ra + Ct</code>.</li>
<li>De verdadero a aguja: <code>Ra = Rv − Ct</code>.</li>
</ul>` },
 { h:'Marcaciones, mareas y luces', b:`
<ul>
<li><b>Marcación</b>: ángulo entre la <b>proa</b> y el objeto.</li>
<li><b>Demora</b>: ángulo entre el <b>norte</b> y el objeto. <code>Dv = Rv + marcación</code> (estribor +, babor −).</li>
<li><b>Enfilación</b>: dos puntos conocidos alineados.</li>
<li><b>Cero hidrográfico</b>: el nivel desde el que se miden las sondas de la carta.</li>
<li><b>Profundidad real</b> = sonda + altura de la marea.</li>
<li><b>Pleamar</b>: marea alta. <b>Bajamar</b>: marea baja.</li>
</ul>` }
]},
{ id:11, n:4, t:'Carta de navegación', d:'Cálculos con rumbos, tiempos y distancias. Necesitas 2 de 4.', lessons:[
 { h:'Cómo se resuelven', b:`
<p>En el examen te dan la <b>carta del Estrecho</b> y haces los cálculos con regla, compás y transportador. Con las fórmulas de la teoría 10 son sumas y restas.</p>
<ol>
<li>Pasa el rumbo de <b>aguja a verdadero</b> con la corrección total.</li>
<li>Dibuja la línea en la carta y mide la distancia.</li>
<li>Con <b>velocidad × tiempo</b> calcula la distancia o la hora de llegada.</li>
<li>Para situarte, cruza <b>dos líneas de posición</b> (dos demoras o marcaciones).</li>
</ol>
<p class="tip">Trabajo extra: practica con una carta real y su instrumental. Aquí entrenas los cálculos, no el dibujo.</p>` }
]}
];

function topmark(t,c){

  });
  h+='</div>';
  if(mode==='reveal'){
    if(it.pick===null)h+=`<div class="why bad"><b>Sin contestar.</b> ${q.e}</div>`;
    else{const ok=isOk(it);h+=`<div class="why ${ok?'ok':'bad'}"><b>${ok?'Correcto.':'No es esa.'}</b> ${q.e}</div>`}
  }
  return h;
}

/* ---------- TEMARIO / LECCIÓN ---------- */
function viewTemario(){

function viewUnit(uid){

function mountChecks(u,i){
  const box=app.querySelector(`[data-check="${i}"]`);
  const pool=BANK.filter(q=>q.u===u.id&&q.l===i);
  const qs=shuffle(pool).slice(0,2);
  if(!qs.length){box.remove();return}
  box.innerHTML=`<div class="eyebrow">Comprueba que lo has entendido</div>`;
  qs.forEach(q=>{
    const it=mkItem(q);const w=document.createElement('div');box.appendChild(w);

      w.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{

/* ---------- PRÁCTICA ---------- */
function startPractice(title,gen,back){
  const qs=gen();if(!qs.length)return;
  top();drawPractice({title,gen,items:qs.map(mkItem),i:0,back:back||'#test'});
}
function drawPractice(run){
  const it=run.items[run.i],ans=it.pick!==null,last=run.i===run.items.length-1;
  shell('test',`<section class="card"><div class="prog"><span>${run.title}</span><span>${run.i+1} de ${run.items.length}</span></div><div class="bar"><i style="width:${pct(run.i+(ans?1:0),run.items.length)}%"></i></div></section>
  <section class="card" id="qbox">${qHTML(it,ans?'reveal':'open')}</section>
  <div class="row"><a class="btn" href="${run.back}">Salir</a>${ans?`<button class="btn primary" id="nx">${last?'Ver resultado':'Siguiente'}</button>`:''}</div>`);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{it.pick=+b.dataset.pos;record(it.q.id,isOk(it));drawPractice(run)});
  const nx=document.getElementById('nx');
  if(nx)nx.onclick=()=>{top();if(last)practiceResult(run);else{run.i++;drawPractice(run)}};
}
function reviewHTML(items,onlyWrong){
  const list=items.filter(it=>!onlyWrong||!isOk(it));
  if(!list.length)return '';
  return `<section class="review"><h2>${onlyWrong?'Para repasar':'Revisión'}</h2>${list.map(it=>`<div class="card">${qHTML(it,'reveal')}</div>`).join('')}</section>`;
}
function practiceResult(run){
  const ok=run.items.filter(isOk).length,n=run.items.length;
  shell('test',`<section class="card"><div class="eyebrow">${run.title}</div><div class="verdict ${pct(ok,n)>=70?'ok':'bad'}">${ok} de ${n} correctas</div>
  <p class="muted" style="margin:6px 0 14px">${pct(ok,n)>=70?'Buen nivel. Sigue practicando para mantenerlo.':'Repasa la teoría del tema y vuelve a intentarlo.'}</p>
  <div class="row"><button class="btn primary" id="again">Repetir con otras preguntas</button><a class="btn" href="${run.back}">Volver</a></div></section>${reviewHTML(run.items,true)}`);
  document.getElementById('again').onclick=()=>startPractice(run.title,run.gen,run.back);
}

/* ---------- SIMULACRO ---------- */
function buildExam(){
  let qs=[];UNITS.forEach(u=>qs=qs.concat(shuffle(BANK.filter(q=>q.u===u.id)).slice(0,u.n)));
  return qs;   // en el orden del examen real: tema 1 a 11
}
function viewSim(){
  const hist=S.sims.slice(-5).reverse();
  shell('simulacro',`<section><h1 style="font-size:30px">Simulacro de examen</h1><p class="muted" style="margin-top:8px">${TOTAL} preguntas, ${MINUTES} minutos y el mismo reparto por temas que el examen real. No se corrige hasta entregar.</p></section>
  <section class="card"><h3>Para aprobar</h3><ul style="margin:8px 0 16px;padding-left:20px"><li>Al menos <b>${PASS} aciertos</b> de ${TOTAL} (máximo ${TOTAL-PASS} errores).</li><li>Balizamiento: al menos <b>3 de 5</b>.</li><li>RIPA: al menos <b>5 de 10</b>.</li><li>Carta de navegación: al menos <b>2 de 4</b>.</li></ul>
  <button class="btn primary" id="go">Empezar simulacro</button></section>
  ${hist.length?`<section class="card"><h3>Últimos intentos</h3><div class="scroll"><table><thead><tr><th>Fecha</th><th>Aciertos</th><th>Resultado</th></tr></thead><tbody>${hist.map(s=>`<tr><td>${s.d}</td><td>${s.ok} / ${s.n}</td><td><span class="pill ${s.pass?'ok':'bad'}">${s.pass?'Aprobado':'Suspenso'}</span></td></tr>`).join('')}</tbody></table></div></section>`:''}`);
  document.getElementById('go').onclick=()=>startExam();
}
function startExam(){
  const run={items:buildExam().map(mkItem),i:0,end:Date.now()+MINUTES*60000,confirm:false};
  clearTimer();top();
  timerId=setInterval(()=>{
    const left=Math.max(0,Math.round((run.end-Date.now())/1000));
    const t=document.getElementById('timer');
    if(t){t.textContent=fmt(left);t.classList.toggle('low',left<300)}
    if(left<=0){clearTimer();examResult(run,true)}
  },1000);
  drawExam(run);
}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function drawExam(run){
  const it=run.items[run.i],n=run.items.length,left=Math.max(0,Math.round((run.end-Date.now())/1000));
  const unans=run.items.filter(x=>x.pick===null).length;
  shell('simulacro',`<section class="card"><div class="prog"><span>Pregunta ${run.i+1} de ${n} · ${UBY[it.q.u].t}</span><span class="timer" id="timer">${fmt(left)}</span></div></section>
  <section class="card" id="qbox">${qHTML(it,'exam')}</section>
  <div class="row"><button class="btn" id="pv" ${run.i===0?'disabled':''}>Anterior</button><button class="btn" id="nx" ${run.i===n-1?'disabled':''}>Siguiente</button><span class="grow"></span><button class="btn primary" id="fin">Entregar</button></div>
  ${run.confirm?`<section class="card"><p style="margin:0 0 12px"><b>${unans?`Te quedan ${unans} sin contestar.`:'Has contestado todas.'}</b> Las que dejes en blanco cuentan como error. ¿Entregar el examen?</p><div class="row"><button class="btn primary" id="yes">Sí, entregar</button><button class="btn" id="no">Seguir</button></div></section>`:''}
  <section class="card"><div class="grid">${run.items.map((x,k)=>`<button data-k="${k}" class="${k===run.i?'cur':x.pick!==null?'ans':''}" aria-label="Pregunta ${k+1}">${k+1}</button>`).join('')}</div></section>`);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{it.pick=+b.dataset.pos;drawExam(run)});
  app.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>{run.i=+b.dataset.k;top();drawExam(run)});
  document.getElementById('pv').onclick=()=>{run.i--;top();drawExam(run)};
  document.getElementById('nx').onclick=()=>{run.i++;top();drawExam(run)};
  document.getElementById('fin').onclick=()=>{run.confirm=true;drawExam(run)};
  const y=document.getElementById('yes');if(y){y.onclick=()=>{clearTimer();examResult(run,false)};document.getElementById('no').onclick=()=>{run.confirm=false;drawExam(run)}}
}
function examResult(run,timeUp){
  clearTimer();top();
  run.items.forEach(it=>{if(it.pick!==null)record(it.q.id,isOk(it))});
  const ok=run.items.filter(isOk).length,n=run.items.length;
  const by={};UNITS.forEach(u=>by[u.id]={ok:0,n:0});
  run.items.forEach(it=>{by[it.q.u].n++;if(isOk(it))by[it.q.u].ok++});
  const fails=[];
  if(ok<PASS)fails.push(`Aciertos totales: ${ok} (mínimo ${PASS}).`);
  Object.keys(EXAM_MIN).forEach(u=>{if(by[u].ok<EXAM_MIN[u])fails.push(`${UBY[u].t}: ${by[u].ok} aciertos (mínimo ${EXAM_MIN[u]}).`)});
  const pass=!fails.length;
  S.sims.push({d:new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'short'}),ok,n,pass});save();
  shell('simulacro',`<section class="card"><div class="eyebrow">${timeUp?'Se acabó el tiempo':'Simulacro entregado'}</div>
  <div class="verdict ${pass?'ok':'bad'}">${pass?'Aprobado':'Suspenso'} · ${ok} de ${n}</div>
  ${pass?'<p class="muted" style="margin:6px 0 0">Cumples el total y los mínimos de cada bloque.</p>':`<ul style="margin:10px 0 0;padding-left:20px">${fails.map(f=>`<li>${f}</li>`).join('')}</ul>`}
  <div class="row" style="margin-top:16px"><button class="btn primary" id="again">Otro simulacro</button><a class="btn" href="#fallos">Repasar fallos</a></div></section>
  <section class="card"><h3 style="margin-bottom:8px">Resultado por tema</h3><div class="scroll"><table><thead><tr><th>Tema</th><th>Aciertos</th><th>Mínimo</th><th></th></tr></thead><tbody>${UNITS.map(u=>{const b=by[u.id],m=EXAM_MIN[u.id];const st=m?(b.ok>=m?'<span class="pill ok">Cumple</span>':'<span class="pill bad">No llega</span>'):'';return `<tr><td>${u.id}. ${u.t}</td><td>${b.ok} / ${b.n}</td><td>${m||'-'}</td><td>${st}</td></tr>`}).join('')}</tbody></table></div></section>
  ${reviewHTML(run.items,true)}`);
  document.getElementById('again').onclick=()=>startExam();
}
